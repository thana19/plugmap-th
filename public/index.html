<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EV Charger Map</title>
  <meta name="description" content="แผนที่รวมจุดชาร์จ EV ประเทศไทยสำหรับทีม">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="map" aria-label="แผนที่จุดชาร์จ EV"></div>

  <header class="topbar">
    <div class="topbar-title">
      <strong>จุดชาร์จ EV</strong>
      <span id="status" role="status" aria-live="polite">กำลังเริ่มต้น…</span>
    </div>
    <button id="btn-filter" class="btn" type="button" aria-expanded="false" aria-controls="filter-panel">
      กรอง<span id="filter-badge" class="badge" hidden>0</span>
    </button>
  </header>

  <section id="filter-panel" class="filter-panel" hidden aria-label="ตัวกรอง"></section>

  <div class="fabs">
    <button id="btn-locate" class="fab fab-round" type="button" aria-label="ไปที่ตำแหน่งของฉัน">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
    </button>
    <button id="btn-add" class="fab fab-main" type="button">+ เพิ่มจุด</button>
  </div>

  <aside id="sheet" class="sheet" aria-hidden="true" aria-live="polite"></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>

  <noscript><p class="noscript">ต้องเปิด JavaScript เพื่อใช้งานแผนที่</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
